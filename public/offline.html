<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickChat - Офлайн</title>
    <script>
      (function() {
        localStorage.removeItem('theme');
        const theme = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <style>
      :root {
        --bg-primary: #0f0f1a;
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.6);
        --card-bg: rgba(255, 255, 255, 0.05);
        --border: rgba(255, 255, 255, 0.1);
        --accent: #6366f1;
      }

      [data-theme="light"] {
        --bg-primary: #f1f5f9;
        --text-primary: #0f172a;
        --text-secondary: rgba(15, 23, 42, 0.6);
        --card-bg: rgba(255, 255, 255, 0.8);
        --border: rgba(0, 0, 0, 0.1);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-primary);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-primary);
        padding: 20px;
      }

      .container {
        text-align: center;
        max-width: 320px;
        padding: 40px 32px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 20px;
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 24px;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }

      p { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; }

      .button {
        background: var(--accent);
        color: white;
        border: none;
        padding: 14px 32px;
        font-size: 15px;
        font-weight: 600;
        border-radius: 12px;
        cursor: pointer;
        width: 100%;
      }

      .button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .icon { font-size: 48px; margin-bottom: 20px; }
    </style>
  </head>
  <body>
    <div class="container" id="content">
      <!-- JS заменит контент -->
    </div>
    <script>
      const content = document.getElementById('content');

      const connectingHTML = `
        <div class="spinner"></div>
        <h1>Подключение...</h1>
        <p>Пытаемся установить соединение</p>
      `;

      const offlineHTML = `
        <div class="icon">📡</div>
        <h1>Нет подключения</h1>
        <p>Интернет-соединение потеряно. Проверьте подключение и попробуйте снова.</p>
        <button class="button" onclick="handleRetry()">Обновить</button>
      `;

      function showConnecting() {
        content.innerHTML = connectingHTML;
      }

      function showOffline() {
        content.innerHTML = offlineHTML;
      }

      function handleRetry() {
        showConnecting();
        
        const btn = content.querySelector('.button');
        btn.disabled = true;
        
        setTimeout(() => {
          fetch('/', { method: 'HEAD', cache: 'no-store' })
            .then(() => window.location.href = '/')
            .catch(() => showOffline());
        }, 3000);
      }

      // Авто-Retry при первом заходе
      if (!sessionStorage.getItem('retried')) {
        sessionStorage.setItem('retried', 'true');
        showConnecting();
        
        setTimeout(() => {
          fetch('/', { method: 'HEAD', cache: 'no-store' })
            .then(() => window.location.href = '/')
            .catch(() => showOffline());
        }, 3000);
      } else {
        showOffline();
      }
    </script>
  </body>
</html>
