<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/appicon-64x64.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    <title>QuickChat</title>
    <script>
      // Таймаут для загрузки основного приложения
      const LOAD_TIMEOUT = 5000;
      
      // Проверяем, загрузился ли React
      const checkAppLoaded = () => {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          return true;
        }
        return false;
      };

      // Если приложение не загрузилось за 5 секунд - показываем offline
      const timer = setTimeout(() => {
        if (!checkAppLoaded()) {
          window.location.href = '/offline.html';
        }
      }, LOAD_TIMEOUT);

      // Если приложение загрузилось - отменяем таймер
      window.addEventListener('load', () => {
        if (checkAppLoaded()) {
          clearTimeout(timer);
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
